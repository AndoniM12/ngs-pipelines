# Entorno de R para el análisis posterior a QIIME 2.
# qiime2R no está en Bioconda: tras crear el entorno, instalarlo desde GitHub:
#   Rscript -e 'remotes::install_github("jbisanz/qiime2R")'
name: metataxonomica-R
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base
  - r-remotes
  - r-ggplot2
  - r-vegan
  - bioconductor-phyloseq
  - bioconductor-microbiome
